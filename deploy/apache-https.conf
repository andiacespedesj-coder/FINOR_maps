<VirtualHost *:80>
    ServerName 162.35.162.131
    DocumentRoot /var/www/finor-certbot

    <Directory /var/www/finor-certbot>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://162.35.162.131%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/finor-error.log
    CustomLog ${APACHE_LOG_DIR}/finor-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName 162.35.162.131

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/162.35.162.131/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/162.35.162.131/privkey.pem

    LimitRequestBody 26214400
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass /static/ !
    ProxyPass /media/ !
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    Alias /static/ /opt/finor-maps/staticfiles/
    <Directory /opt/finor-maps/staticfiles>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Alias /media/ /opt/finor-maps/media/
    <Directory /opt/finor-maps/media>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/finor-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/finor-ssl-access.log combined
</VirtualHost>
